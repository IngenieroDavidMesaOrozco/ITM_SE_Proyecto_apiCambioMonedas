version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      - echo Iniciando sesion en Amazon ECR...
      - aws --version
      - REPOSITORY_URI=127228003108.dkr.ecr.us-east-2.amazonaws.com/api-cambio-monedas
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $REPOSITORY_URI
  build:
    commands:
      - echo Compilando el proyecto Spring Boot...
      - mvn clean package -DskipTests
      - echo Construyendo la imagen Docker...
      - docker build -t $REPOSITORY_URI:latest .
  post_build:
    commands:
      - echo Subiendo la imagen a Amazon ECR...
      - docker push $REPOSITORY_URI:latest
      - echo Listo, imagen subida con exito.
